name: art audit
on:
  workflow_dispatch:
  push:
    paths: [sync/art_audit.py, sync/art_frames.txt, .github/workflows/art_audit.yml]
permissions:
  contents: write
concurrency:
  group: art-audit
  cancel-in-progress: true
jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow imageio-ffmpeg
      - run: |
          if [ -s sync/art_frames.txt ]; then export FRAMES="$(grep -v '^#' sync/art_frames.txt | tr '\n' ';')"; fi
          python sync/art_audit.py
      # candidates go to their own branch so the site itself stays small
      - run: |
          git config user.name "book-den-bot"
          git config user.email "book-den-bot@users.noreply.github.com"
          git checkout -B audit-art
          git add -f audit/steel
          git diff --cached --quiet || git commit -m "Steel header art candidates (public-domain Fleischer Superman frames)"
          git push -f origin audit-art
