name: Audible sync
on:
  workflow_dispatch:
  schedule:
    - cron: "23 11 * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.AUDIBLE_COUNTRY_CODE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: mkb79/setup-audible-cli@v1
        with:
          adp-token: ${{ secrets.AUDIBLE_ADP_TOKEN }}
          device-private-key: ${{ secrets.AUDIBLE_DEVICE_PRIVATE_KEY }}
          country-code: ${{ vars.AUDIBLE_COUNTRY_CODE }}
      - name: Read library
        run: |
          audible api library \
            --param num_results=1000 \
            --param response_groups=product_desc,contributors,is_finished,percent_complete,listening_status \
            --output library.json > /dev/null
      - name: Read finish dates
        continue-on-error: true
        run: audible api stats/status/finished --param start_date=2015-01-01T00:00:00.000Z --output finished.json > /dev/null
      - name: Send to Book Den
        env:
          DEN_STORE_URL: https://script.google.com/macros/s/AKfycbxhY9gpaLCuiZXMIJufA1-JoYVThIKfglXglisMiPKZMMHXj3RFHnMdxAgfuN1zcMEtuQ/exec
          DEN_KEY: w0fzVaKZmPNbUBMgLMSn5IDg
        run: python sync/audible.py
      - name: Keep the schedule alive
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(date +%d)" = "01" ]; then
            date -u +%FT%TZ > .heartbeat
            git config user.name "Book Den"; git config user.email "delvindavis13@yahoo.com"
            git add .heartbeat && git commit -m "heartbeat" && git push || true
          fi
