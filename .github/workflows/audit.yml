name: audit
on:
  workflow_dispatch:
  push:
    paths: [sync/audit.py, .github/workflows/audit.yml]
permissions:
  contents: write
concurrency:
  group: audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DEN_STORE_URL: https://script.google.com/macros/s/AKfycbxhY9gpaLCuiZXMIJufA1-JoYVThIKfglXglisMiPKZMMHXj3RFHnMdxAgfuN1zcMEtuQ/exec
      DEN_KEY: w0fzVaKZmPNbUBMgLMSn5IDg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: quick passes
        run: |
          git config user.name "book-den-bot"
          git config user.email "book-den-bot@users.noreply.github.com"
          push() { git add audit; git diff --cached --quiet || git commit -m "Accuracy audit data: $1"; for i in 1 2 3 4; do git pull --rebase && git push && break; sleep 5; done; }
          python sync/audit.py steam pkmn wikiraw links; push "game covers, infobox lines, link check"
          python sync/audit.py anime imdb2; push "anime records, remaining IMDb rows"
          python sync/audit.py books; push "book cover sheets"
