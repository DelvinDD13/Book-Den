name: audit
on:
  workflow_dispatch:
    inputs:
      todo:
        description: steps to run, space separated (empty runs the default)
        required: false
        default: ''
  push:
    paths: [sync/audit.py, .github/workflows/audit.yml]
permissions:
  contents: write
concurrency:
  group: audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DEN_STORE_URL: https://script.google.com/macros/s/AKfycbxhY9gpaLCuiZXMIJufA1-JoYVThIKfglXglisMiPKZMMHXj3RFHnMdxAgfuN1zcMEtuQ/exec
      DEN_KEY: w0fzVaKZmPNbUBMgLMSn5IDg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - if: contains(github.event.inputs.todo, 'coveraudit')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr && pip install pytesseract
      - name: passes
        env:
          TODO: ${{ github.event.inputs.todo }}
        run: |
          git config user.name "book-den-bot"
          git config user.email "book-den-bot@users.noreply.github.com"
          python sync/audit.py $TODO
          # results go to their own branch so the site itself stays small
          git checkout -B audit-data
          git add -f audit
          git diff --cached --quiet || git commit -m "Accuracy audit data"
          git push -f origin audit-data
