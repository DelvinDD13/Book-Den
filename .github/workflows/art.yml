name: art
on:
  workflow_dispatch:
  push:
    paths: [sync/art.py, .github/workflows/art.yml]
permissions:
  contents: write
jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python sync/art.py
      - run: |
          git config user.name "book-den-bot"
          git config user.email "book-den-bot@users.noreply.github.com"
          git add art
          git diff --cached --quiet || git commit -m "Public-domain and CC art for Book Den (see art/credits.json)"
          git push
